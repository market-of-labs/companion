org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 的内置 Kotlin 与新 DSL 都走默认值（都是开）。本工程已按官方迁移指南
# 移除了 org.jetbrains.kotlin.android 插件，所以这里不再出现
# android.builtInKotlin / android.newDsl —— 显式写出来反而是在「退回旧行为」。

# 这里刻意不写 android.suppressUnsupportedCompileSdk。
# 早先 compileSdk=37 会触发「AGP 只测到 36.1」的警告，但那是 AGP 9.0.1 的问题；
# 本工程已升到 AGP 9.3.2，官方支持上限就是 API 37，警告的根因消失了。
# 用抑制开关盖住一个已经不存在的问题，只会让将来真的踩到版本超限时也没有提示。

kotlin.code.style=official
